<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 508" role="img" aria-labelledby="cr-narrow-title cr-narrow-desc" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title id="cr-narrow-title">How much cheaper the smaller model is, on the price sheet and on a re-priced Claude Code trace</title>
<desc id="cr-narrow-desc">Opus 5.5 → Sonnet 5.5: 2.0 on the price sheet, 2.0 on the trace; Fable 5.2 → Sonnet 5.5: 4.0 on the price sheet, 3.3 on the trace; Sonnet 5.5 → Haiku 5.5: 20.0 on the price sheet, 3.4 on the trace; Same, if prompts stayed under 100k: 20.0 on the price sheet, 15.0 on the trace.</desc>
<style>.cr-s{fill:#fcfcfb}.cr-p{fill:#2a78d6}.cr-r{fill:#eb6834}.cr-t1{fill:#1f1f1e}.cr-t2{fill:#5b5a55}.cr-g{stroke:#e4e3de;stroke-width:1}.cr-a{stroke:#bdbcb5;stroke-width:1}@media (prefers-color-scheme: dark){.cr-s{fill:#1a1a19}.cr-p{fill:#3987e5}.cr-r{fill:#d95926}.cr-t1{fill:#f0efec}.cr-t2{fill:#c3c2b7}.cr-g{stroke:#2f2f2d}.cr-a{stroke:#55544f}}</style>
