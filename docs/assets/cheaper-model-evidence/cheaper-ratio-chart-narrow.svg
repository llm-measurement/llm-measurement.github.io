<text class="cr-t1" x="16" y="24" font-size="18" text-anchor="start" font-weight="600">How much cheaper is</text>
<text class="cr-t1" x="16" y="46" font-size="18" text-anchor="start" font-weight="600">the smaller model?</text>
<rect class="cr-p" x="16" y="64" width="12" height="12" rx="3"/>
<text class="cr-t2" x="36" y="75" font-size="15" text-anchor="start">Price sheet (base input price)</text>
