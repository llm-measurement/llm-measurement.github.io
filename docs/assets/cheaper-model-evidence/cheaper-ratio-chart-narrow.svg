<path class="cr-p" d="M16,136 h22.2 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-22.2 z"><title>Opus 5.5 → Sonnet 5.5, price sheet: 2.0× cheaper</title></path>
