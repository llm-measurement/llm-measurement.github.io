<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" role="img" aria-labelledby="cr-wide-title cr-wide-desc" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title id="cr-wide-title">How much cheaper the smaller model is, on the price sheet and on a re-priced Claude Code trace</title>
<desc id="cr-wide-desc">Opus 5.5 → Sonnet 5.5: 2.0 on the price sheet, 2.0 on the trace; Fable 5.2 → Sonnet 5.5: 4.0 on the price sheet, 3.3 on the trace; Sonnet 5.5 → Haiku 5.5: 20.0 on the price sheet, 3.4 on the trace; Same, if prompts stayed under 100k: 20.0 on the price sheet, 15.0 on the trace.</desc>
<style>.cr-s{fill:#fcfcfb}.cr-p{fill:#2a78d6}.cr-r{fill:#eb6834}.cr-t1{fill:#1f1f1e}.cr-t2{fill:#5b5a55}.cr-g{stroke:#e4e3de;stroke-width:1}.cr-a{stroke:#bdbcb5;stroke-width:1}@media (prefers-color-scheme: dark){.cr-s{fill:#1a1a19}.cr-p{fill:#3987e5}.cr-r{fill:#d95926}.cr-t1{fill:#f0efec}.cr-t2{fill:#c3c2b7}.cr-g{stroke:#2f2f2d}.cr-a{stroke:#55544f}}</style>
<rect class="cr-s" width="680" height="348"/>
<text class="cr-t1" x="16" y="26" font-size="15" text-anchor="start" font-weight="600">How much cheaper is the smaller model?</text>
<rect class="cr-p" x="16" y="42" width="12" height="12" rx="3"/>
<text class="cr-t2" x="34" y="52" font-size="12" text-anchor="start">Price sheet (base input price)</text>
<rect class="cr-r" x="230" y="42" width="12" height="12" rx="3"/>
<text class="cr-t2" x="248" y="52" font-size="12" text-anchor="start">233 Claude Code sessions, re-priced with caching</text>
<line class="cr-g" x1="236.0" y1="72" x2="236.0" y2="296"/>
<text class="cr-t2" x="236.0" y="314" font-size="11" text-anchor="middle">0×</text>
<line class="cr-g" x1="333.0" y1="72" x2="333.0" y2="296"/>
<text class="cr-t2" x="333.0" y="314" font-size="11" text-anchor="middle">5×</text>
<line class="cr-g" x1="430.0" y1="72" x2="430.0" y2="296"/>
<text class="cr-t2" x="430.0" y="314" font-size="11" text-anchor="middle">10×</text>
<line class="cr-g" x1="527.0" y1="72" x2="527.0" y2="296"/>
<text class="cr-t2" x="527.0" y="314" font-size="11" text-anchor="middle">15×</text>
<line class="cr-g" x1="624.0" y1="72" x2="624.0" y2="296"/>
<text class="cr-t2" x="624.0" y="314" font-size="11" text-anchor="middle">20×</text>
<text class="cr-t2" x="430.0" y="332" font-size="11" text-anchor="middle">times cheaper than the bigger model</text>
<text class="cr-t1" x="224" y="97" font-size="12.5" text-anchor="end">Opus 5.5 → Sonnet 5.5</text>
<path class="cr-p" d="M236,78 h34.8 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-34.8 z"><title>Opus 5.5 → Sonnet 5.5, price sheet: 2.0× cheaper</title></path>
<text class="cr-t1" x="280.8" y="89" font-size="11.5" text-anchor="start">2.0×</text>
<path class="cr-r" d="M236,94 h34.8 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-34.8 z"><title>Opus 5.5 → Sonnet 5.5, on the trace: 2.0× cheaper</title></path>
<text class="cr-t1" x="280.8" y="105" font-size="11.5" text-anchor="start">2.0×</text>
<text class="cr-t1" x="224" y="153" font-size="12.5" text-anchor="end">Fable 5.2 → Sonnet 5.5</text>
<path class="cr-p" d="M236,134 h73.6 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-73.6 z"><title>Fable 5.2 → Sonnet 5.5, price sheet: 4.0× cheaper</title></path>
<text class="cr-t1" x="319.6" y="145" font-size="11.5" text-anchor="start">4.0×</text>
<path class="cr-r" d="M236,150 h60.6 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-60.6 z"><title>Fable 5.2 → Sonnet 5.5, on the trace: 3.3× cheaper</title></path>
<text class="cr-t1" x="306.6" y="161" font-size="11.5" text-anchor="start">3.3×</text>
<text class="cr-t1" x="224" y="209" font-size="12.5" text-anchor="end">Sonnet 5.5 → Haiku 5.5</text>
<path class="cr-p" d="M236,190 h384.0 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-384.0 z"><title>Sonnet 5.5 → Haiku 5.5, price sheet: 20.0× cheaper</title></path>
<text class="cr-t1" x="630.0" y="201" font-size="11.5" text-anchor="start">20.0×</text>
<path class="cr-r" d="M236,206 h61.1 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-61.1 z"><title>Sonnet 5.5 → Haiku 5.5, on the trace: 3.4× cheaper</title></path>
<text class="cr-t1" x="307.1" y="217" font-size="11.5" text-anchor="start">3.4×</text>
<text class="cr-t1" x="224" y="265" font-size="12.5" text-anchor="end">Same, if prompts stayed under 100k</text>
<path class="cr-p" d="M236,246 h384.0 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-384.0 z"><title>Same, if prompts stayed under 100k, price sheet: 20.0× cheaper</title></path>
<text class="cr-t1" x="630.0" y="257" font-size="11.5" text-anchor="start">20.0×</text>
<path class="cr-r" d="M236,262 h286.6 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-286.6 z"><title>Same, if prompts stayed under 100k, on the trace: 15.0× cheaper</title></path>
<text class="cr-t1" x="532.6" y="273" font-size="11.5" text-anchor="start">15.0×</text>
<line class="cr-a" x1="236" y1="72" x2="236" y2="296"/></svg>