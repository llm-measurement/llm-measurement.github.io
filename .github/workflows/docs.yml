name: docs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python3 scripts/build.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/check.py
      - run: python3 scripts/check.py --release-pins
      - run: python3 scripts/check_summaries.py
      - run: python3 -m unittest discover -s assets/summary-evidence/scripts -p 'test_*.py'
      - run: git diff --exit-code -- docs
      - run: python3 scripts/sitemap.py --output "$RUNNER_TEMP/site-preview"
      - run: python3 scripts/sitemap.py --check "$RUNNER_TEMP/site-preview/sitemap.xml"
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - name: Validate pinned site artifact metadata
        id: pin
        run: python3 scripts/release_cache.py --consumer-pin
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restored
        with:
          path: .site-release-cache
          key: ${{ steps.pin.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: Require exact cache and verify every byte and original signed subject
        env:
          EXACT_HIT: ${{ steps.restored.outputs.cache-hit }}
          MANIFEST_SHA256: ${{ steps.pin.outputs.manifest_sha256 }}
        run: |
          test "$EXACT_HIT" = true
          python3 scripts/release_cache.py --verify .site-release-cache --manifest-sha256 "$MANIFEST_SHA256"
      - run: python3 scripts/outsider.py --output evidence/local
        env:
          SITE_RELEASE_CACHE: ${{ github.workspace }}/.site-release-cache
  own-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      # https://raw.githubusercontent.com/llm-measurement/fleetdiff/78c6448de2f11e96ca63fb5d6ecff2ad2364304a/examples/litellm-spend/images.json
      - run: docker pull postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
      # Published collector v0.6.2 and the Contrib 0.161.0 capture-recipe pin.
      - run: docker pull ghcr.io/llm-measurement/otelcol-genai-sketches@sha256:c2573a74714249c2e407477997903da5cc367e3d7405bccf0d7cfc049c5fe289
      - run: docker pull otel/opentelemetry-collector-contrib@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
      - name: Validate pinned site artifact metadata
        id: pin
        run: python3 scripts/release_cache.py --consumer-pin
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restored
        with:
          path: .site-release-cache
          key: ${{ steps.pin.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: Require exact cache and verify every byte and original signed subject
        env:
          EXACT_HIT: ${{ steps.restored.outputs.cache-hit }}
          MANIFEST_SHA256: ${{ steps.pin.outputs.manifest_sha256 }}
        run: |
          test "$EXACT_HIT" = true
          python3 scripts/release_cache.py --verify .site-release-cache --manifest-sha256 "$MANIFEST_SHA256"
      - run: python3 scripts/check.py --own-data --output evidence/local/own-data
        env:
          SITE_RELEASE_CACHE: ${{ github.workspace }}/.site-release-cache
      - name: Preserve successful synthetic own-data evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-own-data-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: evidence/local/own-data/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, examples, own-data]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python3 scripts/sitemap.py --output "$RUNNER_TEMP/site-publication"
      - run: python3 scripts/sitemap.py --check "$RUNNER_TEMP/site-publication/sitemap.xml"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/site-publication
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  indexnow:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: indexnow-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify live pages and notify IndexNow
        run: python3 scripts/indexnow.py --submit
